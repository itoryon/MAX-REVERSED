name: Build MAX (patched)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APKTOOL_VERSION: 3.0.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download apktool ${{ env.APKTOOL_VERSION }}
        run: |
          curl -fL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar apktool.jar --version

      - name: Build APK (apktool b)
        run: |
          java -jar apktool.jar b . -o MAX-patched-unsigned.apk

      - name: Locate Android build-tools
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          echo "path=$BT" >> "$GITHUB_OUTPUT"
          echo "Using build-tools: $BT"

      - name: Zipalign
        run: |
          "${{ steps.sdk.outputs.path }}zipalign" -p -f 4 \
            MAX-patched-unsigned.apk MAX-patched-aligned.apk

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "KS=release.keystore"
              echo "KS_PASS=$KEYSTORE_PASSWORD"
              echo "KS_ALIAS=$KEY_ALIAS"
              echo "KS_KEYPASS=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using keystore from secrets."
          else
            keytool -genkeypair -v -keystore release.keystore -alias maxkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass maxmax -keypass maxmax \
              -dname "CN=MAX-REVERSED, OU=dev, O=dev, L=NA, S=NA, C=NA"
            {
              echo "KS=release.keystore"
              echo "KS_PASS=maxmax"
              echo "KS_ALIAS=maxkey"
              echo "KS_KEYPASS=maxmax"
            } >> "$GITHUB_ENV"
            echo "No secrets set — generated an ephemeral debug keystore."
          fi

      - name: Sign APK
        run: |
          "${{ steps.sdk.outputs.path }}apksigner" sign \
            --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_KEYPASS" \
            --out MAX-patched.apk MAX-patched-aligned.apk
          "${{ steps.sdk.outputs.path }}apksigner" verify --print-certs MAX-patched.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-patched-apk
          path: MAX-patched.apk
          if-no-file-found: error
